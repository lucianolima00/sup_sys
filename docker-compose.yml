version: '3.5'
services:
    mysql:
        container_name: supsys_db
        image: mysql:8.0.33
        hostname: mysql
        restart: unless-stopped
        volumes:
            - supsys_db:/var/lib/mysql
        env_file:
            - .env.db
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s
        networks:
            - supsys
    app:
        container_name: supsys_app
        build:
            context: .
            args:
                # Pass APP_ENV into the image build (controls composer/npm flags).
                # Set APP_ENV=production in your shell for a prod build; defaults to local.
                APP_ENV: ${APP_ENV:-local}
        depends_on:
            mysql:
                condition: service_healthy
        hostname: app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '8001:8080'
        env_file:
            - .env
        environment:
            APP_ENV: ${APP_ENV:-local}
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: supsys
            DB_USERNAME: root
            DB_PASSWORD: '123456'
        volumes:
            - './storage:/var/www/html/storage'
            - './.env:/var/www/html/.env'
        networks:
            - supsys

volumes:
    supsys_db:

networks:
    supsys:
        driver: bridge
