# fly.toml app configuration file generated for supsys on 2023-04-18T23:48:32-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "supsys"
primary_region = "gig"

[build]
  [build.args]
    NODE_VERSION = "18"
    PHP_VERSION = "8.2"

[env]
  APP_ENV = "production"
  LOG_CHANNEL = "stderr"
  LOG_LEVEL = "info"
  LOG_STDERR_FORMATTER = "Monolog\\Formatter\\JsonFormatter"
  DB_CONNECTION = "mysql"
  DB_HOST = "aws.connect.psdb.cloud"
  DB_PORT = "3306"
  DB_DATABASE = "sup_sys"
  MYSQL_ATTR_SSL_CA= "/etc/ssl/certs/ca-certificates.crt"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true

[checks]
  [checks.alive]
    type = "tcp"
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
